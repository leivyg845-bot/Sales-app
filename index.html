<style>

*{box-sizing:border-box}

.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item{cursor:pointer}

button{width:auto;background:var(--acc);color:#fff;border:0;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}

.plus{background:#fff;color:var(--hdr);border-radius:50%;width:34px;height:34px;padding:0;font-size:22px;line-height:1}

.p0{background:#dbeafe;color:#1d4ed8}.p1{background:#d1fae5;color:#047857}.p2{background:#fef3c7;color:#b45309}.p3{background:#ffedd5;color:#c2410c}.p4{background:#ede9fe;color:#6d28d9}.p5{background:#dcfce7;color:#166534}

.big{width:100%;background:var(--acc);color:#fff;border-radius:10px;padding:12px;font-weight:600;margin:6px 0}
.tot{background:rgba(31,123,58,.14);border-radius:10px;padding:10px}
.ic{font-size:20px;text-decoration:none}.lead h3{margin:0;font-size:17px}
.hdr{background:transparent;color:var(--text);margin:0 -16px 6px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 8px;position:static}
.hdr h1{color:var(--text);font-size:30px;font-weight:700;letter-spacing:-.5px}
.hb{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(20,35,27,.1)}
.plus{background:var(--acc);color:#fff;width:48px;height:48px;font-size:26px}
.card{border:0;border-radius:20px;box-shadow:0 1px 2px rgba(20,35,27,.05),0 8px 24px rgba(20,35,27,.06);padding:14px}

.big{border-radius:16px;padding:15px;font-size:16px}
.banner{border-radius:20px}.thumb{border-radius:14px}
.thumb{width:76px;height:76px;background:#E3EDE6}.banner{background:linear-gradient(160deg,#CFE3D5,#A9CDB4);height:190px}
.lead h3{font-size:17px;font-weight:600}
input,select,textarea{border-radius:12px}
#q{height:48px;border:0;box-shadow:0 1px 2px rgba(20,35,27,.06);background:var(--card);padding:0 16px}
.st b{font-size:28px}
.fld{padding:8px 0}
.card{margin:14px 0}
body{padding-bottom:40px}

input[type=file]{padding:8px}
</style>

function links(l){
 var h="",ph=(l.p||"").replace(/[^+\d]/g,"");
 if(ph)h+='<a class="tab on" href="tel:'+esc(ph)+'">Call</a><a class="tab" href="sms:'+esc(ph)+'">Text</a>';
 if(l.e)h+='<a class="tab" href="mailto:'+esc(l.e)+'">Email</a>';
 if(l.ad)h+='<a class="tab" target="_blank" href="https://maps.google.com/?q='+encodeURIComponent(l.ad)+'">Map</a>';
 $("ql").innerHTML=h}
function files(l){
 var box=$("fl");box.innerHTML="";
 if(!db)$("fm").textContent="Heads up: this device blocks file storage, so files only stay until you close the page.";if(!l.a.length){if(db)$("fm").textContent="Nothing attached yet.";return}
 if(db&&$("fm").textContent.indexOf("Couldn")!=0)$("fm").textContent="";
 l.a.forEach(function(a){
  var isImg=(a.type||"").indexOf("image")==0;
  var d=document.createElement("div");d.className="f";
  if(!isImg)d.appendChild(document.createTextNode("PDF "+a.name));
  var x=document.createElement("button");x.className="x";x.textContent="\u00d7";
  x.onclick=function(e){e.stopPropagation();ask(x,function(){delF(a.id);l.a=l.a.filter(function(y){return y!==a});save();files(l)},"Delete?")};
  d.appendChild(x);box.appendChild(d);
  urlFor(a.id,function(u){if(isImg){var im=document.createElement("img");im.src=u;d.appendChild(im)}
   d.onclick=function(){$("ob").innerHTML=isImg?'<img src="'+u+'">':'<iframe src="'+u+'"></iframe>';$("oo").href=u;$("ov").className="on"}})})}
